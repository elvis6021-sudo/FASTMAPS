<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastMaps · Editor de estilo .gst</title>
<style>
  * { box-sizing: border-box; }
  :root { --azul:#009CEB; --navy:#164469; --line:#e3e8ef; --muted:#6b7787; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:#1f2733; background:#f4f6f9; }
  header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap;
    padding:.7rem 1.2rem; background:linear-gradient(160deg,#0e2247,#081225); color:#fff; box-shadow:0 2px 12px rgba(14,34,71,.18); }
  header h1 { font-size:1.02rem; margin:0; font-weight:700; }
  header .sp { flex:1; }
  .btn { border:0; border-radius:8px; padding:.5rem .95rem; font-weight:600; font-size:.88rem; cursor:pointer; }
  .btn-p { background:var(--azul); color:#fff; } .btn-g { background:rgba(255,255,255,.14); color:#fff; }
  .btn:hover { filter:brightness(1.08); }
  .tag { display:inline-block; font-size:.68rem; padding:.05rem .45rem; border-radius:999px; background:rgba(255,255,255,.16); color:#fff; }
  .layout { display:grid; grid-template-columns: 1fr 420px; gap:1rem; max-width:1440px; margin:1rem auto; padding:0 1rem 3rem; }
  @media (max-width:1080px){ .layout{ grid-template-columns:1fr; } }
  .meta { color:var(--muted); font-size:.85rem; margin:.1rem 0 .7rem; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 6px 22px rgba(14,34,71,.06); }
  thead th { text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:.6rem .5rem; border-bottom:1px solid var(--line); background:#fafbfc; }
  tbody td { padding:.4rem .5rem; border-bottom:1px solid var(--line); font-size:.86rem; vertical-align:middle; }
  tbody tr { cursor:grab; } tbody tr.drag { opacity:.4; } tbody tr.over td { border-top:2px solid var(--azul); }
  tbody tr:hover { background:#f7fafd; }
  .grip { color:#c2ccd8; cursor:grab; user-select:none; }
  .ord { color:var(--muted); font-variant-numeric:tabular-nums; width:1.6rem; text-align:right; }
  .desc input { width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:.3rem .35rem; font-size:.86rem; }
  .desc input:hover,.desc input:focus { border-color:var(--line); background:#fff; outline:none; }
  .file { color:var(--muted); font-size:.72rem; }
  .cas { display:inline-block; font-size:.62rem; padding:.02rem .35rem; border-radius:999px; background:#eef4fa; color:var(--navy); margin-left:.3rem; }
  .sw-wrap { display:flex; align-items:center; gap:.35rem; }
  input[type=color] { width:30px; height:24px; border:1px solid var(--line); border-radius:6px; padding:0; background:#fff; cursor:pointer; }
  input[type=number] { width:52px; border:1px solid var(--line); border-radius:6px; padding:.28rem .35rem; font-size:.82rem; }
  .muted-cell { color:var(--muted); font-size:.74rem; }
  .chk { width:16px; height:16px; accent-color:var(--azul); }
  .side { position:sticky; top:70px; align-self:start; }
  .card { background:#fff; border-radius:12px; box-shadow:0 6px 22px rgba(14,34,71,.06); padding:.9rem; }
  .card h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:.1rem 0 .6rem; }
  #preview { width:100%; height:auto; border-radius:10px; border:1px solid var(--line); display:block; }
  .hint { font-size:.76rem; color:var(--muted); margin-top:.6rem; line-height:1.5; }
  .hint a { color:var(--azul); }
  .empty { text-align:center; color:var(--muted); padding:3rem 1rem; }
</style>
</head>
<body>
<header>
  <h1>FastMaps · Editor <code>.gst</code></h1>
  <span class="tag" id="gstName">—</span>
  <span class="sp"></span>
  <label class="btn btn-g">Cargar .gst<input id="fileInput" type="file" accept=".gst" hidden></label>
  <button class="btn btn-g" id="btnSample">Muestra</button>
  <button class="btn btn-p" id="btnExport">Exportar .gst</button>
</header>

<div class="layout">
  <div>
    <div class="meta" id="meta">Carga un <code>.gst</code> o abre la muestra.</div>
    <div id="content"><div class="empty">Sin datos.</div></div>
  </div>
  <div class="side">
    <div class="card">
      <h2>Vista previa (escena de ejemplo)</h2>
      <svg id="preview" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="hint">Se dibuja con tus estilos actuales, en el orden de las capas (casing incluido). Compárala con <a href="https://www.openstreetmap.org" target="_blank">openstreetmap.org</a> y ajusta color/grosor. Arrastra las filas para reordenar el dibujo.</div>
    </div>
  </div>
</div>

<script>
// ─── color COLORREF <-> hex ────────────────────────────────────────────────
const decToHex = d => { const n=Number(d)>>>0; const r=n&0xff,g=(n>>8)&0xff,b=(n>>16)&0xff; return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join(''); };
const hexToDec = h => { const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h); if(!m) return 0; return parseInt(m[1],16)+(parseInt(m[2],16)<<8)+(parseInt(m[3],16)<<16); };
const LINE_RE = /^"([^"]*)"\s*=\s*"([^"]*)"\s*$/;

// ─── modelo de bloques (preserva todo, permite reordenar) ───────────────────
let PRE=[], POST=[], BLOCKS=[], GEONAME='';
function parseGst(text){
  const lines = text.split(/\r?\n/);
  PRE=[]; POST=[]; BLOCKS=[]; GEONAME='';
  let cur=null, inTables=false, ended=false;
  for(const raw of lines){
    const m = LINE_RE.exec(raw.trim());
    if(m && m[1]==='\\GEOSET\\NAME') GEONAME=m[2];
    if(ended){ POST.push(raw); continue; }
    if(raw.trim()==='end_metadata'){ ended=true; POST.push(raw); continue; }
    const open = m ? /^\\TABLE\\(\d+)$/.exec(m[1]) : null;
    if(open){ inTables=true; cur={ origN:+open[1], lines:[raw] }; BLOCKS.push(cur); continue; }
    if(inTables && cur && m && new RegExp('^\\\\TABLE\\\\'+cur.origN+'\\\\').test(m[1])){ cur.lines.push(raw); continue; }
    if(!inTables) PRE.push(raw); else POST.push(raw);
  }
  return BLOCKS.length;
}
function bget(b, suffix){ const key='\\TABLE\\'+b.origN+'\\'+suffix; for(const ln of b.lines){ const m=LINE_RE.exec(ln.trim()); if(m&&m[1]===key) return m[2]; } return undefined; }
function bhas(b, suffix){ return bget(b,suffix)!==undefined; }
function bset(b, suffix, val){ const key='\\TABLE\\'+b.origN+'\\'+suffix; for(let i=0;i<b.lines.length;i++){ const m=LINE_RE.exec(b.lines[i].trim()); if(m&&m[1]===key){ b.lines[i]='"'+key+'" = "'+val+'"'; return; } } }

function fields(b){
  const lineColor = bhas(b,'DISPLAY\\LINEPEN\\Color') ? 'DISPLAY\\LINEPEN\\Color' : bhas(b,'DISPLAY\\PEN\\Color') ? 'DISPLAY\\PEN\\Color' : null;
  const width = bhas(b,'DISPLAY\\LINEPEN\\LineWidth') ? 'DISPLAY\\LINEPEN\\LineWidth' : bhas(b,'DISPLAY\\PEN\\LineWidth') ? 'DISPLAY\\PEN\\LineWidth' : null;
  const fill = bhas(b,'DISPLAY\\BRUSH\\Forecolor') ? 'DISPLAY\\BRUSH\\Forecolor' : null;
  const labelZoom = bhas(b,'LABEL\\ZOOM\\MAX') ? 'LABEL\\ZOOM\\MAX' : null;
  return { lineColor, width, fill, labelZoom };
}

// ─── escena de preview ──────────────────────────────────────────────────────
const SCENE = {
  land:'#eef0e8',
  water:[[0,300],[120,288],[150,360],[0,360]],
  green:[[380,0],[520,0],[520,120],[400,96]],
  buildings:[[228,150,26,20],[262,150,20,26],[228,178,30,18],[300,138,24,24],[264,182,26,20]],
  river:[[0,120],[120,140],[240,110],[360,150],[520,122]],
  roads:{
    motorway:[[[16,10],[200,150],[360,360]]],
    trunk:[[[0,60],[180,120],[380,70]]],
    primary:[[[0,196],[520,150]]],
    secondary:[[[262,0],[300,360]]],
    tertiary:[[[300,176],[440,236]]],
    residential:[[[60,222],[210,212]],[[60,262],[214,252]],[[92,200],[110,300]],[[150,206],[168,300]],[[210,212],[214,252]]],
    coast:[[[150,360],[120,288],[0,300]]],
    oneway:[[[214,252],[340,246]]]
  }
};
function roleOf(b){
  const f=((bget(b,'FILE')||'')+' '+(bget(b,'DESCRIPTION')||'')).toLowerCase();
  if(f.includes('motorway')) return 'motorway';
  if(f.includes('trunk')) return 'trunk';
  if(f.includes('primary')) return 'primary';
  if(f.includes('secondary')) return 'secondary';
  if(f.includes('tertiary')) return 'tertiary';
  if(f.includes('allstreets')||f.includes('residential')) return 'residential';
  if(f.includes('oneway')) return 'oneway';
  if(f.includes('rivers')) return 'river';
  if(f.includes('coastline')) return 'coast';
  if(f.includes('water')) return 'water';
  if(f.includes('green')) return 'green';
  if(f.includes('landuse')) return 'landuse';
  if(f.includes('buildings')) return 'buildings';
  return null;
}
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const e=document.createElementNS(svgNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function drawScene(){
  const svg=document.getElementById('preview'); svg.innerHTML='';
  svg.appendChild(el('rect',{x:0,y:0,width:520,height:360,fill:SCENE.land}));
  const pts=a=>a.map(p=>p.join(',')).join(' ');
  const W=w=>Math.max(1,(+w||1)*1.7);
  for(const b of BLOCKS){
    const r=roleOf(b); if(!r) continue;
    const F=fields(b);
    const line=F.lineColor?decToHex(bget(b,F.lineColor)):'#888';
    const fill=F.fill?decToHex(bget(b,F.fill)):null;
    const w=F.width?bget(b,F.width):1;
    if(r==='water'&&fill) svg.appendChild(el('polygon',{points:pts(SCENE.water),fill,stroke:line,'stroke-width':1}));
    else if(r==='green'&&fill) svg.appendChild(el('polygon',{points:pts(SCENE.green),fill,stroke:line,'stroke-width':1}));
    else if(r==='landuse'&&fill) svg.appendChild(el('rect',{x:150,y:150,width:120,height:90,fill,stroke:line,'stroke-width':1}));
    else if(r==='buildings'&&fill) SCENE.buildings.forEach(bb=>svg.appendChild(el('rect',{x:bb[0],y:bb[1],width:bb[2],height:bb[3],fill,stroke:line,'stroke-width':1})));
    else if(r==='river') svg.appendChild(el('polyline',{points:pts(SCENE.river),fill:'none',stroke:line,'stroke-width':W(w),'stroke-linecap':'round','stroke-linejoin':'round'}));
    else if(r==='coast') SCENE.roads.coast.forEach(seg=>svg.appendChild(el('polyline',{points:pts(seg),fill:'none',stroke:line,'stroke-width':W(w)})));
    else if(SCENE.roads[r]){
      SCENE.roads[r].forEach(seg=>svg.appendChild(el('polyline',{points:pts(seg),fill:'none',stroke:line,'stroke-width':W(w),'stroke-linecap':'round','stroke-linejoin':'round'})));
      if(r==='oneway') SCENE.roads.oneway.forEach(seg=>drawArrows(svg,seg));
    }
  }
}
function drawArrows(svg,seg){
  for(let t=0.3;t<1;t+=0.5){
    const [x1,y1]=seg[0],[x2,y2]=seg[seg.length-1];
    const x=x1+(x2-x1)*t, y=y1+(y2-y1)*t, ang=Math.atan2(y2-y1,x2-x1), s=6;
    const p1=[x-Math.cos(ang-0.5)*s,y-Math.sin(ang-0.5)*s], p2=[x-Math.cos(ang+0.5)*s,y-Math.sin(ang+0.5)*s];
    svg.appendChild(el('polygon',{points:[[x,y],p1,p2].map(p=>p.join(',')).join(' '),fill:'#444'}));
  }
}

// ─── tabla ──────────────────────────────────────────────────────────────────
function render(){
  const c=document.getElementById('content');
  if(!BLOCKS.length){ c.innerHTML='<div class="empty">Sin datos.</div>'; return; }
  const rows=BLOCKS.map((b,i)=>{
    const F=fields(b);
    const desc=bget(b,'DESCRIPTION')||'';
    const casing=/casing/i.test(desc);
    const lineHex=F.lineColor?decToHex(bget(b,F.lineColor)):null;
    const width=F.width?bget(b,F.width):'';
    const fillHex=F.fill?decToHex(bget(b,F.fill)):null;
    const zMin=bget(b,'ZOOM\\MIN')||'', zMax=bget(b,'ZOOM\\MAX')||'';
    const lblZ=F.labelZoom?(bget(b,F.labelZoom)||''):'';
    const auto=bget(b,'AUTOLABEL')==='TRUE';
    return `<tr draggable="true" data-i="${i}">
      <td class="grip">⋮⋮</td><td class="ord">${i+1}</td>
      <td class="desc"><input value="${(desc).replace(/"/g,'&quot;')}" data-suf="DESCRIPTION" class="e-desc">${casing?'<span class="cas">casing</span>':''}<div class="file">${bget(b,'FILE')||''}</div></td>
      <td>${F.lineColor?`<div class="sw-wrap"><input type="color" value="${lineHex}" data-suf="${F.lineColor}" class="e-color"><span class="muted-cell">${lineHex}</span></div>`:'<span class="muted-cell">—</span>'}</td>
      <td>${F.width?`<input type="number" min="0" max="14" value="${width}" data-suf="${F.width}" class="e-num">`:'—'}</td>
      <td>${F.fill?`<div class="sw-wrap"><input type="color" value="${fillHex}" data-suf="${F.fill}" class="e-color"><span class="muted-cell">${fillHex}</span></div>`:'<span class="muted-cell">—</span>'}</td>
      <td><input type="number" value="${zMin}" data-suf="ZOOM\\MIN" class="e-num"></td>
      <td><input type="number" value="${zMax}" data-suf="ZOOM\\MAX" class="e-num"></td>
      <td>${F.labelZoom?`<input type="number" value="${lblZ}" data-suf="${F.labelZoom}" class="e-num">`:'—'}</td>
      <td style="text-align:center"><input type="checkbox" class="chk e-chk" data-suf="AUTOLABEL" ${auto?'checked':''}></td>
    </tr>`;
  }).join('');
  c.innerHTML=`<table><thead><tr><th></th><th>#</th><th>Capa</th><th>Color línea</th><th>Grosor</th><th>Relleno</th><th>Z min</th><th>Z max</th><th>Z etiq.</th><th>Etiq.</th></tr></thead><tbody id="tb">${rows}</tbody></table>`;
  const tb=c.querySelector('#tb');
  const B=i=>BLOCKS[+i];
  tb.querySelectorAll('.e-color').forEach(el=>el.addEventListener('input',e=>{ bset(B(e.target.closest('tr').dataset.i),e.target.dataset.suf,hexToDec(e.target.value)); e.target.nextElementSibling.textContent=e.target.value; drawScene(); }));
  tb.querySelectorAll('.e-num').forEach(el=>el.addEventListener('input',e=>{ bset(B(e.target.closest('tr').dataset.i),e.target.dataset.suf,e.target.value); drawScene(); }));
  tb.querySelectorAll('.e-desc').forEach(el=>el.addEventListener('input',e=>bset(B(e.target.closest('tr').dataset.i),e.target.dataset.suf,e.target.value)));
  tb.querySelectorAll('.e-chk').forEach(el=>el.addEventListener('change',e=>bset(B(e.target.closest('tr').dataset.i),e.target.dataset.suf,e.target.checked?'TRUE':'FALSE')));
  let dragI=null;
  tb.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('dragstart',()=>{ dragI=+tr.dataset.i; tr.classList.add('drag'); });
    tr.addEventListener('dragend',()=>{ tr.classList.remove('drag'); tb.querySelectorAll('tr').forEach(x=>x.classList.remove('over')); });
    tr.addEventListener('dragover',e=>{ e.preventDefault(); tr.classList.add('over'); });
    tr.addEventListener('dragleave',()=>tr.classList.remove('over'));
    tr.addEventListener('drop',e=>{ e.preventDefault(); const to=+tr.dataset.i; if(dragI===null||dragI===to) return; const [m]=BLOCKS.splice(dragI,1); BLOCKS.splice(to,0,m); render(); drawScene(); });
  });
}

function load(text,name){
  parseGst(text);
  document.getElementById('gstName').textContent=GEONAME||name||'geoset';
  document.getElementById('meta').textContent=`${BLOCKS.length} capas · "${GEONAME||'?'}" · arrastra filas para reordenar el dibujo`;
  render(); drawScene();
}

// ─── export: renumera bloques y concatena ───────────────────────────────────
function buildGstText(){
  const out=[...PRE];
  BLOCKS.forEach((b,idx)=>{ const newN=idx+1; const re=new RegExp('^\\\\TABLE\\\\'+b.origN+'(\\\\|$)');
    for(const ln of b.lines){ const m=LINE_RE.exec(ln.trim());
      if(m){ const nk=m[1].replace(re,'\\TABLE\\'+newN+'$1'); out.push('"'+nk+'" = "'+m[2]+'"'); }
      else out.push(ln);
    }
  });
  out.push(...POST);
  return out.join('\r\n');
}
async function exportGst(){
  if(!BLOCKS.length) return;
  const text=buildGstText();
  if(window.fastmaps){ await window.fastmaps.saveGst((GEONAME||'geoset')+'_editado.gst', text); return; } // Electron: guardar nativo
  const bytes=new Uint8Array(text.length); for(let i=0;i<text.length;i++) bytes[i]=text.charCodeAt(i)&0xff;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
  a.download=(GEONAME||'geoset')+'_editado.gst'; a.click(); URL.revokeObjectURL(a.href);
}

document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ const buf=new Uint8Array(rd.result); let s=''; for(let i=0;i<buf.length;i++) s+=String.fromCharCode(buf[i]); load(s,f.name.replace(/\.gst$/i,'')); };
  rd.readAsArrayBuffer(f); });
document.getElementById('btnSample').addEventListener('click',()=>{ const s=document.getElementById('sampleGst').textContent; if(s&&s.trim()&&!s.includes('SAMPLE_GST')) load(s,'ecuador_osm'); });
document.getElementById('btnExport').addEventListener('click',exportGst);
window.addEventListener('DOMContentLoaded',()=>{
  const s=document.getElementById('sampleGst').textContent; if(s&&s.trim()&&!s.includes('SAMPLE_GST')) load(s,'ecuador_osm');
  // En Electron (app de escritorio): usar diálogo nativo para abrir en vez del <input file>.
  if(window.fastmaps){
    const lbl=document.querySelector('label.btn');
    if(lbl) lbl.addEventListener('click', async e=>{ e.preventDefault(); const r=await window.fastmaps.openGst(); if(r) load(r.text, (r.path||'').split(/[\\/]/).pop().replace(/\.gst$/i,'')); });
  }
});
</script>
